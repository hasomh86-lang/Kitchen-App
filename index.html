
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Private Kitchen Menu Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Prevent pinch-to-zoom
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      });
      
      // Prevent double-tap to zoom (optional but often desired with user-scalable=no)
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // Prevent multi-touch zoom
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              parchment: '#FDFBF7',
              darkbg: '#111111',
              darkcard: '#1A1A1A',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      /* Hide scrollbar for clean UI */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @page {
        size: landscape;
        margin: 0;
      }
      @media print {
        body {
          -webkit-print-color-adjust: exact;
        }
      }

      /* Transitions - Enhanced for theme switching */
      .theme-transition {
        transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                    color 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                    border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                    box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                    opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Animations */
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      
      .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }
      .animate-scale-in { animation: scaleIn 0.4s ease-out forwards; }
      .animate-float { animation: float 5s ease-in-out infinite; }

      /* Background Styles */
      .bg-parchment {
        background-color: #FDFBF7;
        background-image: radial-gradient(#2C2C2C 0.5px, transparent 0.5px);
        background-size: 24px 24px;
        background-opacity: 0.05;
      }

      /* Responsive Image Pattern - Fixed for iPad/Safari Compatibility */
      .responsive-image {
        width: 100%;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        display: block;
        position: relative;
        background-color: transparent;
      }

      .responsive-image img {
        width: 100%;
        height: 100%;
        object-fit: contain !important;
        object-position: center;
        display: block;
      }

      img {
        max-width: 100%;
        height: auto;
      }
    </style>
